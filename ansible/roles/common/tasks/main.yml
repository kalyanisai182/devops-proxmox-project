---
- name: Wait for cloud-init to finish (it holds the apt lock on first boot)
  ansible.builtin.command: cloud-init status --wait
  register: cloud_init
  changed_when: false
  # rc 0 = done; rc 2 = done with recoverable warnings (still fine)
  failed_when: cloud_init.rc not in [0, 2]

- name: Update apt cache and upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

# Proxmox cloud-init sets manage_etc_hosts, so cloud-init rewrites
# /etc/hosts from its template on every boot. Add the block to BOTH
# the template and the live file, or it disappears after a reboot.
- name: Add all project hosts to /etc/hosts (and cloud-init's template)
  ansible.builtin.blockinfile:
    path: "{{ item }}"
    marker: "# {mark} ANSIBLE MANAGED: devops-proxmox-project hosts"
    block: |
      {% for host in groups['all'] %}
      {{ hostvars[host].ansible_host }} {{ host }}
      {% endfor %}
  loop:
    - /etc/hosts
    - /etc/cloud/templates/hosts.debian.tmpl

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required
  changed_when: reboot_required.stat.exists
  notify: Reboot
