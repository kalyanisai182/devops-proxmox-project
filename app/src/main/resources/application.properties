spring.application.name=demo-app

# Injected at deploy time: APP_VERSION by the image build (git commit),
# APP_ENV by the Kubernetes overlay (dev / staging / prod)
app.version=${APP_VERSION:dev}
app.environment=${APP_ENV:local}

# Health probes for Kubernetes + Prometheus metrics
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
