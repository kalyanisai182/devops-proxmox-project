apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: registry-db-restore
  namespace: model-registry
spec:
  instances: 1
  storage:
    size: 2Gi
    storageClass: local-path
  bootstrap:
    recovery:
      source: origin
      database: registry
      owner: registry
      recoveryTarget:
        targetTime: "2026-10-13 19:43:29+00"
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: seaweed-store
          serverName: registry-db
