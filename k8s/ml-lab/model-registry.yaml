apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: seaweed-store
  namespace: model-registry
spec:
  retentionPolicy: "7d"
  configuration:
    destinationPath: s3://pg-backups/
    endpointURL: http://10.30.5.20:8333
    s3Credentials:
      accessKeyId:
        name: s3-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: s3-creds
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: registry-db
  namespace: model-registry
spec:
  instances: 1
  storage:
    size: 2Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: registry
      owner: registry
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: seaweed-store
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: registry-nightly
  namespace: model-registry
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: registry-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
